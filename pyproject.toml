[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcps"
version = "0.1.0"
description = "Thin stdio MCP server acting as a logging and secret-injection facade for Home Assistant, Mealie, NetBox, NirvanaHQ and Garmin Connect."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "garminconnect==0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mcps = "mcps.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0911", "E501"]
